[workspace]
members = ["crates/radio-model", "crates/dat-format", "crates/dat-analyzer", "crates/radio-serial", "crates/radio-app"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serialport = { version = "4", default-features = false }
sha2 = "0.10"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
slint-build = "=1.18.1"
radio-model = { path = "crates/radio-model" }
dat-format = { path = "crates/dat-format" }
radio-serial = { path = "crates/radio-serial" }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true

