name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Rust
        shell: pwsh
        run: rustup update stable --no-self-update
      - name: Install development components
        shell: pwsh
        run: rustup component add rustfmt clippy
      - name: Format, lint and test
        shell: pwsh
        run: ./scripts/dev.ps1 -Action check
      - name: Build
        run: cargo build --locked --workspace
      - name: Set up Node.js for source reports
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source inventory
        run: node scripts/source-inventory.cjs --check
      - name: Check public source boundaries
        run: node scripts/check-public-source.cjs

